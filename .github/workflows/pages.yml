name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you redeploy by hand, which is how you refresh the repository list
  # without pushing a commit.
  workflow_dispatch:

# One deploy at a time. Never cancel one midway: a half-finished deploy would
# leave the live site in whatever state it got to.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # prebuild fetches public repositories. If GitHub is unreachable it keeps
      # the committed data/repos.json and carries on, so this never fails the
      # deploy over a network blip.
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
